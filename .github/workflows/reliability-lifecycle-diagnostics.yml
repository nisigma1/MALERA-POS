name: Installed reliability lifecycle diagnostics
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Exact Windows QA artifact run to investigate
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download exact selected candidate
        env:
          GH_TOKEN: ${{ github.token }}
          FOX_CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: gh run download "$env:FOX_CANDIDATE_RUN" -n FOX-QA-Windows-x64 -D work/lifecycle-candidate
      - name: Observe first failure without retries
        shell: pwsh
        run: |
          $manifest=Get-Content work/lifecycle-candidate/release/release-manifest.json -Raw | ConvertFrom-Json
          $installer=Join-Path work/lifecycle-candidate/release $manifest.artifact
          if ((Get-FileHash -LiteralPath $installer).Hash.ToLowerInvariant() -ne $manifest.sha256) { throw 'Candidate hash mismatch' }
          node scripts/qa/verify-reliability-ui.mjs $installer
          if ($LASTEXITCODE -ne 0) { throw 'Lifecycle failed; no retry' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FOX-Lifecycle-Diagnostics
          path: outputs/fox-phase10-ui-*.json
          if-no-files-found: error
          retention-days: 14
