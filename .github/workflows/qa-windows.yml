name: Windows QA installer
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-qa-${{ github.sha }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate private QA candidate
        shell: pwsh
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+-(?:qa|rc)\.\d+$') { throw 'Only a prerelease candidate is permitted; artifact remains explicitly QA/UNSIGNED' }
          if ($env:REPOSITORY_PRIVATE -ne 'true') { throw 'Repository must remain private' }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:production-db
      - run: npm run verify:product-day
      - run: node scripts/verify-product-ui.mjs
      - run: npm run verify:runtime
      - run: npm run verify:checkout
      - run: node scripts/verify-receipt-crashes.mjs
      - run: npm run release:scan
      - run: npm run verify:protection
      - run: node scripts/verify-hardening-runtime.mjs
      - run: node scripts/verify-startup-failures.mjs
      - run: npm run package:win -- --qa
      - run: ./scripts/verify-release.ps1
      - name: Actual clean QA installer and reinstall acceptance
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/verify-installed.mjs "release/FOX-Setup-$version-x64.exe" "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed QA acceptance failed' }
      - name: Actual 0.4.2 and prior-QA upgrades
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          gh run download 37788753990 -n FOX-Windows-x64 -D work/old-release
          if ($LASTEXITCODE -ne 0) { throw 'Pinned original 0.4.2 release build download failed' }
          $old=Get-Content work/old-release/release-manifest.json -Raw | ConvertFrom-Json
          $oldHash=(Get-FileHash work/old-release/FOX-Setup-0.4.2-x64.exe).Hash.ToLowerInvariant()
          if ($old.version -ne '0.4.2' -or $old.commit -ne 'e7361dfaa4375ea7fd2a51a4adfeef0a8b3d4c17' -or $oldHash -ne '8c200e871f399ac4e22d61061d9a55fa2f314b49ecdfbbdc1a294c890f9abb9e' -or $oldHash -ne $old.sha256) { throw 'Original 0.4.2 provenance mismatch' }
          gh run download 37921221790 -n FOX-QA-Windows-x64 -D work/prior-qa
          if ($LASTEXITCODE -ne 0) { throw 'Pinned prior QA download failed' }
          $prior=Get-Content work/prior-qa/release-manifest.json -Raw | ConvertFrom-Json
          if ($prior.commit -ne '4e39afddff9c03847f4cfb2556e5b28a5e1efec9' -or (Get-FileHash work/prior-qa/FOX-Setup-0.5.0-qa.1-x64.exe).Hash.ToLowerInvariant() -ne $prior.sha256) { throw 'Prior QA provenance mismatch' }
          node scripts/verify-installed.mjs work/old-release/FOX-Setup-0.4.2-x64.exe "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw '0.4.2 upgrade failed' }
          node scripts/verify-installed.mjs work/prior-qa/FOX-Setup-0.5.0-qa.1-x64.exe "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'QA upgrade failed' }
          gh run download 38005453394 -n FOX-QA-Windows-x64 -D work/phase51-release
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Phase 5.1 download failed' }
          $phase51=Get-Content work/phase51-release/release/release-manifest.json -Raw | ConvertFrom-Json
          $phase51Hash=(Get-FileHash work/phase51-release/release/FOX-Setup-0.5.0-rc.1-x64.exe).Hash.ToLowerInvariant()
          if ($phase51.commit -ne '112daa1ec8a43d7f7ae9b04672f09c90024ee5e6' -or $phase51Hash -ne '8b004e23763fee61271e07d0e132648de64fb89480c09600759e028fe457f670' -or $phase51Hash -ne $phase51.sha256) { throw 'Phase 5.1 provenance mismatch' }
          node scripts/verify-installed.mjs work/phase51-release/release/FOX-Setup-0.5.0-rc.1-x64.exe "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Phase 5.1 upgrade failed' }

      - name: Retain sanitized acceptance evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/ci-evidence -Force | Out-Null
          Get-ChildItem -LiteralPath $env:TEMP -Directory -Filter 'fox-qa-*' | ForEach-Object {
            $qaDir=$_.FullName
            Get-ChildItem -LiteralPath $qaDir -File | Where-Object Name -match '(?:result|recover-).*\.json$' | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path work/ci-evidence ($_.Directory.Name+'-'+$_.Name))
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FOX-QA-Windows-x64
          path: |
            release/FOX-Setup-*-x64.exe
            release/FOX-Setup-*-x64.exe.sha256
            release/release-manifest.json
            release/FOX-*-sbom.json
            release/signature-verification.json
            work/ci-evidence/*.json
          if-no-files-found: error
          retention-days: 14
