name: Windows QA installer
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-qa-${{ github.sha }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    env:
      FOX_QA_SESSION_SALES: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate private QA candidate
        shell: pwsh
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $visualOutput = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '../../outputs/fox-phase9-regression-screenshots'))
          $financeOutput = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '../../outputs/fox-phase9-screenshots'))
          $reservationsOutput = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '../../outputs/fox-reservations-acceptance'))
          "FOX_FINANCE_OUTPUT=$financeOutput" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FOX_VISUAL_OUTPUT=$visualOutput" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FOX_RESERVATIONS_OUTPUT=$reservationsOutput" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if ($version -notmatch '^\d+\.\d+\.\d+-(?:qa|rc)\.\d+$') { throw 'Only a prerelease candidate is permitted; artifact remains explicitly QA/UNSIGNED' }
          if ($env:REPOSITORY_PRIVATE -ne 'true') { throw 'Repository must remain private' }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:production-db
      - run: npm run verify:cutover
      - run: npm run verify:product-day
      - run: node scripts/verify-product-ui.mjs
      - run: node scripts/verify-finance.mjs
      - run: npm run verify:reservations
      - run: npm run verify:runtime
      - run: npm run verify:checkout
      - run: node scripts/verify-receipt-crashes.mjs
      - run: npm run release:scan
      - run: npm run verify:protection
      - run: node scripts/verify-hardening-runtime.mjs
      - run: node scripts/verify-startup-failures.mjs --stress
      - run: npm run package:win -- --qa
      - run: ./scripts/verify-release.ps1
      - name: Packaged visual acceptance and frozen visual baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download 38067281942 -n FOX-QA-Windows-x64 -D work/phase7-visual-baseline
          if ($LASTEXITCODE -ne 0) { throw 'Frozen visual baseline download failed' }
          $baseline=Get-Content work/phase7-visual-baseline/release/release-manifest.json -Raw | ConvertFrom-Json
          $oldInstaller='work/phase7-visual-baseline/release/FOX-Setup-0.6.0-rc.2-x64.exe'
          if ($baseline.commit -ne '418a9b2f50508d025168e3bda19e4f79aa03b904' -or (Get-FileHash $oldInstaller).Hash.ToLowerInvariant() -ne '40fb84f76e26b6fe14493092cb80d8c06184758eedb9c53e07414f3c51737975') { throw 'Visual baseline provenance mismatch' }
          node scripts/verify-visual.mjs before $oldInstaller
          if ($LASTEXITCODE -ne 0) { throw 'Visual baseline capture failed' }
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/verify-visual.mjs after "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged visual acceptance failed' }
          node scripts/verify-workarea.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual visible window/taskbar acceptance failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FOX-Visual-Acceptance
          path: ${{ env.FOX_VISUAL_OUTPUT }}
          if-no-files-found: warn
          retention-days: 14
      - name: Installed owner financial acceptance
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/verify-finance.mjs "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed financial acceptance failed' }
      - name: Installed phone reservation acceptance
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/verify-reservations.mjs "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed reservation acceptance failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FOX-Reservation-Acceptance
          path: ${{ env.FOX_RESERVATIONS_OUTPUT }}
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FOX-Financial-Acceptance
          path: ${{ env.FOX_FINANCE_OUTPUT }}
          if-no-files-found: warn
          retention-days: 14
      - name: Installed owner UI cutover and native backup/recovery
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/verify-cutover.mjs "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed owner cutover failed' }
      - name: Actual clean QA installer and reinstall acceptance
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/verify-installed.mjs "release/FOX-Setup-$version-x64.exe" "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed QA acceptance failed' }
      - name: Actual 0.4.2 and prior-QA upgrades
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          gh run download 37788753990 -n FOX-Windows-x64 -D work/old-release
          if ($LASTEXITCODE -ne 0) { throw 'Pinned original 0.4.2 release build download failed' }
          $old=Get-Content work/old-release/release-manifest.json -Raw | ConvertFrom-Json
          $oldHash=(Get-FileHash work/old-release/FOX-Setup-0.4.2-x64.exe).Hash.ToLowerInvariant()
          if ($old.version -ne '0.4.2' -or $old.commit -ne 'e7361dfaa4375ea7fd2a51a4adfeef0a8b3d4c17' -or $oldHash -ne '8c200e871f399ac4e22d61061d9a55fa2f314b49ecdfbbdc1a294c890f9abb9e' -or $oldHash -ne $old.sha256) { throw 'Original 0.4.2 provenance mismatch' }
          gh run download 37921221790 -n FOX-QA-Windows-x64 -D work/prior-qa
          if ($LASTEXITCODE -ne 0) { throw 'Pinned prior QA download failed' }
          $prior=Get-Content work/prior-qa/release-manifest.json -Raw | ConvertFrom-Json
          if ($prior.commit -ne '4e39afddff9c03847f4cfb2556e5b28a5e1efec9' -or (Get-FileHash work/prior-qa/FOX-Setup-0.5.0-qa.1-x64.exe).Hash.ToLowerInvariant() -ne $prior.sha256) { throw 'Prior QA provenance mismatch' }
          node scripts/verify-installed.mjs work/old-release/FOX-Setup-0.4.2-x64.exe "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw '0.4.2 upgrade failed' }
          node scripts/verify-installed.mjs work/prior-qa/FOX-Setup-0.5.0-qa.1-x64.exe "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'QA upgrade failed' }
          gh run download 38005453394 -n FOX-QA-Windows-x64 -D work/phase51-release
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Phase 5.1 download failed' }
          $phase51=Get-Content work/phase51-release/release/release-manifest.json -Raw | ConvertFrom-Json
          $phase51Hash=(Get-FileHash work/phase51-release/release/FOX-Setup-0.5.0-rc.1-x64.exe).Hash.ToLowerInvariant()
          if ($phase51.commit -ne '112daa1ec8a43d7f7ae9b04672f09c90024ee5e6' -or $phase51Hash -ne '8b004e23763fee61271e07d0e132648de64fb89480c09600759e028fe457f670' -or $phase51Hash -ne $phase51.sha256) { throw 'Phase 5.1 provenance mismatch' }
          node scripts/verify-installed.mjs work/phase51-release/release/FOX-Setup-0.5.0-rc.1-x64.exe "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Phase 5.1 upgrade failed' }
          gh run download 38040361942 -n FOX-QA-Windows-x64 -D work/phase6-release
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Phase 6 download failed' }
          $phase6=Get-Content work/phase6-release/release/release-manifest.json -Raw | ConvertFrom-Json
          $phase6Hash=(Get-FileHash work/phase6-release/release/FOX-Setup-0.6.0-rc.1-x64.exe).Hash.ToLowerInvariant()
          if ($phase6.commit -ne 'd9135e5d9831c08c496c618ebd9bb90a08e38c8d' -or $phase6Hash -ne 'f21e65437d6f29b34980119270552d384687694d88b6f971a18a57fbe6eff30a' -or $phase6Hash -ne $phase6.sha256) { throw 'Frozen baseline provenance mismatch' }
          node scripts/verify-installed.mjs work/phase6-release/release/FOX-Setup-0.6.0-rc.1-x64.exe "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen baseline upgrade failed' }
          node scripts/verify-installed.mjs work/phase7-visual-baseline/release/FOX-Setup-0.6.0-rc.2-x64.exe "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Phase 7 baseline upgrade failed' }

      - name: Accepted Phase 8 upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download 38084137512 -n FOX-QA-Windows-x64 -D work/phase8-accepted
          if ($LASTEXITCODE -ne 0) { throw 'Accepted Phase 8 download failed' }
          $oldInstaller='work/phase8-accepted/release/FOX-Setup-0.6.0-rc.3-x64.exe'
          $baseline=Get-Content work/phase8-accepted/release/release-manifest.json -Raw | ConvertFrom-Json
          if ($baseline.commit -ne '99f9e7d6ac0a85cd65da0585994e87ecf8110636' -or (Get-FileHash $oldInstaller).Hash.ToLowerInvariant() -ne '6b2168941d9e2656f48d041d1ed7a01d17ab28320269a976d778bd5b1574a69b') { throw 'Phase 8 provenance mismatch' }
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/verify-installed.mjs $oldInstaller "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Phase 8 upgrade failed' }

      - name: Accepted Phase 9 identity restoration upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download 38168532591 -n FOX-QA-Windows-x64 -D work/phase9-accepted
          if ($LASTEXITCODE -ne 0) { throw 'Accepted Phase 9 download failed' }
          $oldInstaller='work/phase9-accepted/release/FOX-Setup-0.7.0-rc.1-x64.exe'
          $baseline=Get-Content work/phase9-accepted/release/release-manifest.json -Raw | ConvertFrom-Json
          if ($baseline.commit -ne 'ce31d9ae6a9d1158f73588b1a7cde1cd61d01bcb' -or (Get-FileHash $oldInstaller).Hash.ToLowerInvariant() -ne 'fb3d31fec62126d4e3535dcdf1745e227837e61438ee51f31da58898ecc2ff5b') { throw 'Phase 9 provenance mismatch' }
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/verify-installed.mjs $oldInstaller "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Phase 9 canonical identity restoration upgrade failed' }

      - name: Accepted Phase 9.1 to reservations upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download 38174448488 -n FOX-QA-Windows-x64 -D work/phase9-1-accepted
          if ($LASTEXITCODE -ne 0) { throw 'Accepted Phase 9.1 download failed' }
          $oldInstaller='work/phase9-1-accepted/release/FOX-Setup-0.7.0-rc.2-x64.exe'
          $baseline=Get-Content work/phase9-1-accepted/release/release-manifest.json -Raw | ConvertFrom-Json
          $oldHash=(Get-FileHash $oldInstaller).Hash.ToLowerInvariant()
          if ($baseline.commit -ne '677792e4f471551f06989fce641b3f56c0f9125a' -or $oldHash -ne 'b822c1a1ac4b980462853d181b0cbebf6d03f42543dd590249bcb4ddf6cf74ae' -or $oldHash -ne $baseline.sha256) { throw 'Phase 9.1 provenance mismatch' }
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/verify-installed.mjs $oldInstaller "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Phase 9.1 reservations upgrade failed' }

      - name: Retain sanitized acceptance evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/ci-evidence -Force | Out-Null
          Get-ChildItem -LiteralPath $env:TEMP -Directory -Filter 'fox-qa-*' | ForEach-Object {
            $qaDir=$_.FullName
            Get-ChildItem -LiteralPath $qaDir -File | Where-Object Name -match '(?:result|recover-).*\.json$' | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path work/ci-evidence ($_.Directory.Name+'-'+$_.Name))
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FOX-QA-Windows-x64
          path: |
            release/FOX-Setup-*-x64.exe
            release/FOX-Setup-*-x64.exe.sha256
            release/release-manifest.json
            release/FOX-*-sbom.json
            release/signature-verification.json
            work/ci-evidence/*.json
          if-no-files-found: error
          retention-days: 14
