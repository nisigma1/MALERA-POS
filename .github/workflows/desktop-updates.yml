name: Desktop updates
on:
  push:
    branches: [codex/duo-hp]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-update-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      FOX_QA_SESSION_SALES: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Regression suite and update-client tests
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/updateClient.node.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run build
      - run: npm run verify:production-db
      - run: npm run verify:product-day
      - run: node scripts/qa/verify-product-ui.mjs
      - run: npm run package:win -- --qa
      - run: ./scripts/release/verify-release.ps1
      - name: Verify the packaged recovery patch
        run: node scripts/qa/verify-windows-shm.mjs --module=release/win-unpacked/resources/app.asar/node_modules/better-sqlite3
      - name: Installed acceptance
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/qa/verify-installed.mjs "release/FOX-Setup-$version-x64.exe" "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node scripts/update/publish-descriptor.mjs
      - name: Publish immutable desktop QA candidate
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_TAG: desktop-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create $env:UPDATE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --latest=false --title "Desktop QA $($env:GITHUB_SHA.Substring(0,8))" --notes "Automatically tested desktop candidate from $env:GITHUB_REF_NAME. QA / UNSIGNED. Installed at next launch by configured terminals." release/desktop-update.json release/release-manifest.json "release/FOX-Setup-$version-x64.exe" "release/FOX-Setup-$version-x64.exe.sha256"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-update-evidence
          path: |
            outputs/
            work/ci-evidence/

