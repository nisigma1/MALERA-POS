name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      FOX_SIGNING_PROVIDER: ${{ vars.FOX_SIGNING_PROVIDER }}
      FOX_SIGNER_SUBJECT: ${{ vars.FOX_SIGNER_SUBJECT }}
      FOX_SIGNING_TIMESTAMP: ${{ vars.FOX_SIGNING_TIMESTAMP }}
      FOX_SIGNING_THUMBPRINT: ${{ vars.FOX_SIGNING_THUMBPRINT }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      FOX_AZURE_ENDPOINT: ${{ vars.FOX_AZURE_ENDPOINT }}
      FOX_AZURE_ACCOUNT: ${{ vars.FOX_AZURE_ACCOUNT }}
      FOX_AZURE_PROFILE: ${{ vars.FOX_AZURE_PROFILE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate exact tag and private repository
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version" -or $version -notmatch '^\d+\.\d+\.\d+(?:-rc\.\d+)?$') { throw 'Version/tag mismatch' }
          if ($env:REPOSITORY_PRIVATE -ne 'true') { throw 'Repository must remain private' }
          if ((git describe --tags --exact-match) -ne $env:RELEASE_TAG) { throw 'Not the tagged commit' }
      - run: npm ci
      - run: npm run rebuild:native
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:production-db
      - run: npm run verify:product-day
      - run: node scripts/verify-product-ui.mjs
      - run: npm run verify:runtime
      - run: npm run verify:checkout
      - run: npm run release:scan
      - run: npm run verify:protection
      - run: node scripts/verify-receipt-crashes.mjs
      - run: node scripts/verify-hardening-runtime.mjs
      - run: node scripts/verify-startup-failures.mjs --stress
      - run: npm run package:win
      - run: ./scripts/verify-release.ps1
      - name: Actual signed installer acceptance
        env:
          FOX_REQUIRE_SIGNED: '1'
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/verify-installed.mjs "release/FOX-Setup-$version-x64.exe" "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed acceptance failed' }
      - name: Actual signed upgrades from 0.4.2 and prior QA
        env:
          GH_TOKEN: ${{ github.token }}
          FOX_REQUIRE_SIGNED: '1'
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          gh run download 37788753990 -n FOX-Windows-x64 -D work/old-release
          if ($LASTEXITCODE -ne 0) { throw 'Pinned original 0.4.2 release build download failed' }
          $old=Get-Content work/old-release/release-manifest.json -Raw | ConvertFrom-Json
          $oldHash=(Get-FileHash work/old-release/FOX-Setup-0.4.2-x64.exe).Hash.ToLowerInvariant()
          if ($old.version -ne '0.4.2' -or $old.commit -ne 'e7361dfaa4375ea7fd2a51a4adfeef0a8b3d4c17' -or $oldHash -ne '8c200e871f399ac4e22d61061d9a55fa2f314b49ecdfbbdc1a294c890f9abb9e' -or $oldHash -ne $old.sha256) { throw 'Original 0.4.2 provenance mismatch' }
          gh run download 37921221790 -n FOX-QA-Windows-x64 -D work/prior-qa
          if ($LASTEXITCODE -ne 0) { throw 'Pinned prior QA download failed; acceptance prerequisite must be restored explicitly' }
          $prior=Get-Content work/prior-qa/release-manifest.json -Raw | ConvertFrom-Json
          if ($prior.commit -ne '4e39afddff9c03847f4cfb2556e5b28a5e1efec9' -or (Get-FileHash work/prior-qa/FOX-Setup-0.5.0-qa.1-x64.exe).Hash.ToLowerInvariant() -ne $prior.sha256) { throw 'Prior QA provenance mismatch' }
          node scripts/verify-installed.mjs work/old-release/FOX-Setup-0.4.2-x64.exe "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Signed 0.4.2 upgrade failed' }
          node scripts/verify-installed.mjs work/prior-qa/FOX-Setup-0.5.0-qa.1-x64.exe "release/FOX-Setup-$version-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Signed QA upgrade failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: FOX-Windows-x64
          path: |
            release/FOX-Setup-*-x64.exe
            release/FOX-Setup-*-x64.exe.sha256
            release/release-manifest.json
            release/FOX-*-sbom.json
            release/signature-verification.json
          if-no-files-found: error
      - name: Create private draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; never replace immutable artifacts' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "FOX $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md "release/FOX-Setup-$version-x64.exe" "release/FOX-Setup-$version-x64.exe.sha256" release/release-manifest.json "release/FOX-$version-sbom.json" release/signature-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
