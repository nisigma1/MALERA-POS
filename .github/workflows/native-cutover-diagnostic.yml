name: Native cutover diagnostic — not release acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-dialog:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci
      - name: Use provenance-checked existing QA binary for controller diagnosis
        shell: pwsh
        run: |
          gh run download 38064738420 -n FOX-QA-Windows-x64 -D work/native-probe-artifact
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic artifact download failed' }
          $manifest=Get-Content work/native-probe-artifact/release/release-manifest.json -Raw | ConvertFrom-Json
          $expectedCommit=(git rev-parse 0174625).Trim()
          if ($manifest.commit -ne $expectedCommit -or $manifest.version -ne '0.6.0-rc.2' -or $manifest.channel -ne 'QA' -or $manifest.signing -ne 'UNSIGNED' -or $manifest.databaseBundled -ne $false -or $manifest.artifact -ne 'FOX-Setup-0.6.0-rc.2-x64.exe') { throw 'Diagnostic provenance mismatch' }
          if ((Get-FileHash work/native-probe-artifact/release/FOX-Setup-0.6.0-rc.2-x64.exe).Hash.ToLowerInvariant() -ne $manifest.sha256) { throw 'Diagnostic binary hash mismatch' }
          git diff --exit-code $expectedCommit HEAD -- src electron/database electron/receipts electron/ipc electron/main/index.ts electron/main/dataProtection.ts electron/main/logging.ts electron/main/security.ts package.json package-lock.json scripts/build-electron.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Runtime changed: build a fresh candidate instead of diagnostic reuse' }
      - name: Fresh isolated installed UI/native cutover only
        run: node scripts/verify-cutover.mjs work/native-probe-artifact/release/FOX-Setup-0.6.0-rc.2-x64.exe
